<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Recording Viewer</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #222; background: #fafafa; }
  header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #eee; display: flex; gap: 16px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { font-size: 12px; color: #888; }
  .layout { display: grid; grid-template-columns: 60% 40%; height: calc(100vh - 50px); }
  .left { padding: 12px; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
  video { width: 100%; max-height: 65%; background: #000; }
  .filters { display: flex; gap: 8px; font-size: 12px; }
  .filters label { user-select: none; }
  .right { border-left: 1px solid #eee; overflow: auto; background: #fff; }
  .row { padding: 6px 12px; border-bottom: 1px solid #f0f0f0; font-size: 12px; cursor: pointer; }
  .row:hover { background: #f7f9ff; }
  .row.active { background: #e8f0ff; }
  .row .ts { color: #888; font-variant-numeric: tabular-nums; }
  .row .type { display: inline-block; min-width: 38px; padding: 0 6px; border-radius: 3px; font-size: 11px; margin-right: 6px; }
  .type.ui { background: #e3f2fd; color: #1565c0; }
  .type.api { background: #fff3e0; color: #ef6c00; }
  .type.nav { background: #f3e5f5; color: #6a1b9a; }
  .type.meta { background: #e0f2f1; color: #00695c; }
  .row pre { margin: 4px 0 0 50px; font-size: 11px; color: #555; white-space: pre-wrap; word-break: break-all; }
  #file-input { display: none; }
  .empty { padding: 32px; text-align: center; color: #888; }
  .btn { font-size: 12px; padding: 4px 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 3px; }
  .stats { font-size: 12px; color: #666; }
</style>
</head>
<body>
<header>
  <h1>Recording Viewer</h1>
  <button class="btn" onclick="document.getElementById('file-input').click()">载入 events.json</button>
  <button class="btn" onclick="document.getElementById('video-input').click()">载入 video.webm</button>
  <input id="file-input" type="file" accept=".json">
  <input id="video-input" type="file" accept="video/*" style="display:none">
  <span class="meta" id="meta-info"></span>
  <span class="stats" id="stats"></span>
</header>
<div class="layout">
  <div class="left">
    <video id="video" controls></video>
    <div class="filters">
      <label><input type="checkbox" data-type="ui" checked> UI</label>
      <label><input type="checkbox" data-type="api" checked> API</label>
      <label><input type="checkbox" data-type="nav" checked> 导航</label>
      <label><input type="checkbox" data-type="meta" checked> Meta</label>
      <input id="search" type="search" placeholder="搜索…" style="margin-left:auto;width:200px;">
    </div>
  </div>
  <div class="right" id="list">
    <div class="empty">把同目录里的 events.json 拖进来,或点上方按钮载入。</div>
  </div>
</div>
<script>
let allEvents = [];
let meta = null;
let startedAt = 0;
const list = document.getElementById('list');
const video = document.getElementById('video');

document.getElementById('file-input').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const data = JSON.parse(await f.text());
  meta = data.meta || {};
  startedAt = meta.startedAt || (data.events?.[0]?.ts || 0);
  allEvents = (data.events || []).slice().sort((a,b) => a.ts - b.ts);
  document.getElementById('meta-info').textContent =
    `开始 ${meta.startedAt ? new Date(meta.startedAt).toLocaleString() : '-'} · 共 ${allEvents.length} 事件`;
  render();
});

document.getElementById('video-input').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  video.src = URL.createObjectURL(f);
});

document.querySelectorAll('.filters input[type=checkbox]').forEach(cb => {
  cb.addEventListener('change', render);
});
document.getElementById('search').addEventListener('input', render);

function render() {
  if (!allEvents.length) return;
  const enabled = {};
  document.querySelectorAll('.filters input[type=checkbox]').forEach(cb => {
    enabled[cb.dataset.type] = cb.checked;
  });
  const q = document.getElementById('search').value.trim().toLowerCase();
  const rows = allEvents.filter(ev => {
    if (!enabled[ev.type]) return false;
    if (q) {
      const blob = JSON.stringify(ev).toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
  let kept = 0, total = 0;
  list.innerHTML = '';
  rows.forEach((ev, i) => {
    total++; kept++;
    const dt = ev.ts - startedAt;
    const div = document.createElement('div');
    div.className = 'row';
    div.dataset.ts = dt;
    div.innerHTML = `
      <span class="ts">${(dt/1000).toFixed(2)}s</span>
      <span class="type ${ev.type}">${ev.type}</span>
      <span>${describe(ev)}</span>
      <pre>${detail(ev)}</pre>`;
    div.addEventListener('click', () => {
      [...list.children].forEach(c => c.classList.remove('active'));
      div.classList.add('active');
      if (video.duration) video.currentTime = Math.max(0, dt / 1000);
    });
    list.appendChild(div);
  });
  document.getElementById('stats').textContent = `显示 ${rows.length} 条`;
}

function describe(ev) {
  if (ev.type === 'ui') {
    const t = ev.target || {};
    const desc = t.role && t.name ? `${t.role} "${t.name}"` : (t.text || t.css || t.tag);
    let suffix = '';
    if (ev.action === 'fill') suffix = ` = "${(ev.value||'').slice(0,40)}"`;
    if (ev.action === 'press') suffix = ` [${ev.key}]`;
    return `<b>${ev.action}</b> ${esc(desc)}${esc(suffix)}`;
  }
  if (ev.type === 'api') {
    return `<b>${ev.method||'GET'}</b> ${ev.status || '...'} ${esc((ev.url||'').slice(0,100))}`;
  }
  if (ev.type === 'nav') return `<b>navigate</b> → ${esc((ev.to||'').slice(0,100))}`;
  if (ev.type === 'meta') return `<b>${ev.action}</b> ${esc((ev.url||'').slice(0,100))}`;
  return ev.action || '';
}
function detail(ev) {
  if (ev.type === 'api') {
    const lines = [];
    if (ev.reqBody) lines.push('req: ' + (ev.reqBody||'').slice(0, 200));
    if (ev.respBody) lines.push('resp: ' + (ev.respBody||'').slice(0, 200));
    return esc(lines.join('\n'));
  }
  if (ev.type === 'ui' && ev.target?.css) return esc('css: ' + ev.target.css);
  return '';
}
function esc(s) { return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
</script>
</body>
</html>
